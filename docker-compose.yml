services:
  seo-lens:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: seo-lens
    restart: always
    depends_on:
      - redis
    env_file:
      - .env.local
    volumes:
      - .:/app
    ports:
      - "8000:8000"   # ✅ exposes FastAPI
    command: >
      sh -c "playwright install chromium && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"

  redis:
    image: redis:8.2.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    env_file:
      - .env.local
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--requirepass", "${REDIS_PASSWORD}"
    ]

volumes:
  redis_data:
