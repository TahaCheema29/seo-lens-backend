<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Scraper Test UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .input-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            padding: 30px;
            display: none;
        }

        .results.active {
            display: block;
        }

        .url-header {
            background: #667eea;
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: 600;
        }

        .category {
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            overflow: hidden;
        }

        .category-header {
            background: #f8f9fa;
            padding: 15px 20px;
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            border-bottom: 2px solid #e9ecef;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-header:hover {
            background: #e9ecef;
        }

        .category-header .toggle {
            font-size: 0.8em;
            color: #667eea;
        }

        .category-content {
            padding: 20px;
            display: none;
        }

        .category-content.active {
            display: block;
        }

        .check-item {
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #ddd;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .check-item.success {
            border-left-color: #28a745;
            background: #d4edda;
        }

        .check-item.warning {
            border-left-color: #ffc107;
            background: #fff3cd;
        }

        .check-item.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }

        .check-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .check-value {
            color: #666;
            font-size: 0.95em;
        }

        .check-guidance {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #ddd;
            color: #555;
            font-style: italic;
            font-size: 0.9em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            opacity: 0.9;
            font-size: 0.9em;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            border-left: 4px solid #dc3545;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 SEO Scraper Test UI</h1>
            <p>Comprehensive SEO Analysis Tool</p>
        </div>

        <div class="input-section">
            <div class="form-group">
                <label for="url">Website URL</label>
                <input type="url" id="url" placeholder="https://example.com" required>
            </div>
            <div class="form-group">
                <label for="crawlMode">Crawl Mode</label>
                <select id="crawlMode">
                    <option value="SITEMAP_ONLY">Sitemap Only</option>
                    <option value="FULL_CRAWL">Full Crawl</option>
                </select>
            </div>
            <button class="btn" onclick="analyzeSEO()">Analyze SEO</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Analyzing website... This may take a few moments.</p>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function analyzeSEO() {
            const url = document.getElementById('url').value;
            const crawlMode = document.getElementById('crawlMode').value;
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            if (!url) {
                alert('Please enter a URL');
                return;
            }

            loading.classList.add('active');
            results.classList.remove('active');
            results.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/seo-tools/analyze-site-seo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        crawl_mode: crawlMode
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.status === 'success' && data.data && data.data.length > 0) {
                    displayResults(data.data);
                } else {
                    results.innerHTML = '<div class="no-results">No results found. Please check the URL and try again.</div>';
                    results.classList.add('active');
                }
            } catch (error) {
                results.innerHTML = `<div class="error-message">Error: ${error.message}</div>`;
                results.classList.add('active');
            } finally {
                loading.classList.remove('active');
            }
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            let html = '';

            results.forEach((result, index) => {
                html += `<div class="url-header">Page ${index + 1}: ${result.url}</div>`;
                
                // Stats Grid
                html += '<div class="stats-grid">';
                html += `<div class="stat-card"><div class="stat-value">${result.internal_links_count || 0}</div><div class="stat-label">Internal Links</div></div>`;
                html += `<div class="stat-card"><div class="stat-value">${result.external_links_count || 0}</div><div class="stat-label">External Links</div></div>`;
                html += `<div class="stat-card"><div class="stat-value">${result.h2_count || 0}</div><div class="stat-label">H2 Tags</div></div>`;
                html += `<div class="stat-card"><div class="stat-value">${result.total_requests || 0}</div><div class="stat-label">Total Requests</div></div>`;
                html += '</div>';

                // Basic SEO Checks
                html += createCategory('Basic SEO Checks', [
                    { label: 'Title', value: result.title || 'N/A', status: 'info' },
                    { label: 'Title Length', value: result.title_length_check || 'N/A', status: getStatus(result.title_length_check) },
                    { label: 'Title Keyword Presence', value: result.title_keyword_presence || 'N/A', status: getStatus(result.title_keyword_presence) },
                    { label: 'Title Quality Guidance', value: result.title_quality_guidance || 'N/A', status: 'info', guidance: true },
                    { label: 'Meta Description', value: result.meta_description || 'N/A', status: 'info' },
                    { label: 'Meta Description Length', value: result.meta_description_length_check || 'N/A', status: getStatus(result.meta_description_length_check) },
                    { label: 'Meta Description Keywords', value: result.meta_description_keyword_presence || 'N/A', status: getStatus(result.meta_description_keyword_presence) },
                    { label: 'Meta Description Guidance', value: result.meta_description_quality_guidance || 'N/A', status: 'info', guidance: true },
                    { label: 'H1 Check', value: result.h1_check || 'N/A', status: getStatus(result.h1_check) },
                    { label: 'H1 Keyword Guidance', value: result.h1_keyword_guidance || 'N/A', status: 'info', guidance: true },
                    { label: 'H1 Content', value: result.h1 || 'N/A', status: 'info' },
                    { label: 'H2 Optimization', value: result.h2_optimization_guidance || 'N/A', status: getStatus(result.h2_optimization_guidance) },
                    { label: 'Image Alt Check', value: result.image_alt_check || 'N/A', status: getStatus(result.image_alt_check) },
                    { label: 'Links Quality Guidance', value: result.links_quality_guidance || 'N/A', status: 'info', guidance: true },
                ]);

                // Advanced SEO Checks
                html += createCategory('Advanced SEO Checks', [
                    { label: 'Canonical Tag', value: result.canonical_check || 'N/A', status: getStatus(result.canonical_check) },
                    { label: 'Canonical URL', value: result.canonical || 'N/A', status: 'info' },
                    { label: 'Noindex Check', value: result.noindex_check || 'N/A', status: getStatus(result.noindex_check) },
                    { label: 'WWW Redirect', value: result.www_redirect_check || 'N/A', status: getStatus(result.www_redirect_check) },
                    { label: 'Robots.txt', value: result.robots_txt_check || 'N/A', status: getStatus(result.robots_txt_check) },
                    { label: 'Open Graph Tags', value: result.open_graph_check || 'N/A', status: getStatus(result.open_graph_check) },
                    { label: 'Schema.org Structured Data', value: result.schema_validation || 'N/A', status: getStatus(result.schema_validation) },
                ]);

                // Performance Checks
                html += createCategory('Performance Checks', [
                    { label: 'HTML Document Size', value: result.html_size_check || 'N/A', status: getStatus(result.html_size_check) },
                    { label: 'Response Time', value: result.response_time_check || 'N/A', status: getStatus(result.response_time_check) },
                    { label: 'Expires Headers', value: result.expires_headers_check || 'N/A', status: getStatus(result.expires_headers_check) },
                    { label: 'Caching Advice', value: result.caching_advice || 'N/A', status: 'info', guidance: true },
                    { label: 'JavaScript Minification', value: result.js_minification_check || 'N/A', status: getStatus(result.js_minification_check) },
                    { label: 'CSS Minification', value: result.css_minification_check || 'N/A', status: getStatus(result.css_minification_check) },
                    { label: 'Total Requests', value: `${result.total_requests || 0} (Images: ${result.image_requests || 0}, JS: ${result.js_requests || 0}, CSS: ${result.css_requests || 0})`, status: 'info' },
                    { label: 'Requests Guidance', value: result.requests_guidance || 'N/A', status: 'info', guidance: true },
                    { label: 'Inline CSS Warning', value: result.inline_css_warning || 'N/A', status: getStatus(result.inline_css_warning) },
                    { label: 'Embedded Objects', value: result.embedded_objects_check || 'N/A', status: getStatus(result.embedded_objects_check) },
                    { label: 'LCP (Largest Contentful Paint)', value: result.lcp || 'N/A', status: 'info' },
                    { label: 'FID (First Input Delay)', value: result.fid || 'N/A', status: 'info' },
                    { label: 'CLS (Cumulative Layout Shift)', value: result.cls || 'N/A', status: 'info' },
                ]);

                // Security Checks
                html += createCategory('Security Checks', [
                    { label: 'HTTPS/SSL Certificate', value: result.https_ssl_check || 'N/A', status: getStatus(result.https_ssl_check) },
                    { label: 'Directory Listing', value: result.directory_listing_check || 'N/A', status: getStatus(result.directory_listing_check) },
                    { label: 'Google Safe Browsing', value: result.safe_browsing_check || 'N/A', status: getStatus(result.safe_browsing_check) },
                ]);

                // Mobile
                html += createCategory('Mobile Responsiveness', [
                    { label: 'Viewport Meta Tag', value: result.mobile_responsiveness || 'N/A', status: getStatus(result.mobile_responsiveness) },
                ]);
            });

            resultsDiv.innerHTML = html;
            resultsDiv.classList.add('active');

            // Add toggle functionality
            document.querySelectorAll('.category-header').forEach(header => {
                header.addEventListener('click', function() {
                    const content = this.nextElementSibling;
                    const toggle = this.querySelector('.toggle');
                    content.classList.toggle('active');
                    toggle.textContent = content.classList.contains('active') ? '▼' : '▶';
                });
            });

            // Expand first category by default
            const firstCategory = document.querySelector('.category-content');
            if (firstCategory) {
                firstCategory.classList.add('active');
                const firstToggle = document.querySelector('.category-header .toggle');
                if (firstToggle) firstToggle.textContent = '▼';
            }
        }

        function createCategory(title, items) {
            let html = `<div class="category">
                <div class="category-header">
                    <span>${title}</span>
                    <span class="toggle">▶</span>
                </div>
                <div class="category-content">`;

            items.forEach(item => {
                if (!item.value || item.value === 'N/A') return;
                
                const statusClass = item.status === 'success' ? 'success' : 
                                   item.status === 'warning' ? 'warning' : 
                                   item.status === 'error' ? 'error' : '';
                
                html += `<div class="check-item ${statusClass}">
                    <div class="check-label">${item.label}</div>
                    <div class="check-value">${item.value}</div>`;
                
                if (item.guidance && item.value && !item.value.includes('N/A')) {
                    html += `<div class="check-guidance">💡 ${item.value}</div>`;
                }
                
                html += `</div>`;
            });

            html += `</div></div>`;
            return html;
        }

        function getStatus(value) {
            if (!value) return 'info';
            if (value.includes('✅')) return 'success';
            if (value.includes('⚠️')) return 'warning';
            if (value.includes('❌')) return 'error';
            return 'info';
        }

        // Allow Enter key to submit
        document.getElementById('url').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                analyzeSEO();
            }
        });
    </script>
</body>
</html>
